spring:
  application:
    name: Zxyy-ai-agent
  profiles:
    active: local
  # application.yml
  datasource:
      url: jdbc:mysql://localhost:3306/chat_memory?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024        #这个默认使用的是text-embedding-v3 生成向量是1024
        max-document-batch-size: 10000

    mcp:
      client:
        type: sync
        request-timeout: 20s
        stdio:
          servers-configuration: classpath:mcp-servers.json




mybatis:
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.Zxyy.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn




